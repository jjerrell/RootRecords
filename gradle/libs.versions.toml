[versions]
# Plugins
agp = "8.3.2"
kotlin = "2.0.0"
ksp = "2.0.0-1.0.23"

# Libraries
compose = "1.6.8"
room-db-core = "2.7.0-alpha05"
room-db-sqlite = "2.5.0-alpha05"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.1" }
androidx-compose-navigation = { module = "androidx.navigation:navigation-compose", version = "2.7.7" }
androidx-compose-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.8.4" }

androidx-datastore-preferences-android = { module = "androidx.datastore:datastore-preferences", version = "1.1.1" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version = "1.1.1" }

compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version = "1.2.1" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room-db-core" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room-db-core" }
room-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "room-db-sqlite" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.7.2" }

# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-core = { group = "junit", name = "junit", version = "4.13.2" }
junit-ext = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.6.1" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version = "6.15.0" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
roomDb = { id ="androidx.room", version.ref = "room-db-core" }
